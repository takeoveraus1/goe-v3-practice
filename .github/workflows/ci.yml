name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.56 can't install browsers on yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
